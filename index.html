<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeDex by miguesco — A field guide to every Pokémon</title>
    <meta name="description" content="Search, filter and explore all 1,025 Pokémon. Evolutions, matchups, team builder and a guessing game. Made by miguesco." />
    <meta name="author" content="Miguel Escobar (miguesco)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="miguesco" />
    <meta property="og:title" content="MeDex by miguesco — A field guide to every Pokémon" />
    <meta property="og:description" content="Search, filter and explore all 1,025 Pokémon. Evolutions, matchups, team builder and a guessing game." />
    <meta property="og:url" content="https://medex-pokedex.vercel.app/" />
    <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1310" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem('medex-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
